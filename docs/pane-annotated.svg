<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="t d">
<title id="t">The usage pane, with each part explained</title>
<desc id="d">An example of the usage-pane with made-up projects. Numbered callouts explain the plan limits, pace, counted period, the split between your conversations and agents, the agent count, projects, sessions, models and the refresh button.</desc>
<defs>
<pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse">
<rect width="4" height="4" fill="#d97757"/>
<path d="M-1 1L1 -1M0 4L4 0M3 5L5 3" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
</pattern>
</defs>
<style>
.bg{fill:#ffffff}.pane{fill:#f6f8fa;stroke:#d0d7de}.bar{fill:#eaeef2}.rest{fill:#d8dee4}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre}
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.p{fill:#1f2328}.d{fill:#656d76}.b{font-weight:600}
.mine{fill:#2f81f7}.ag{fill:url(#hatch)}.ok{fill:#1a7f37}.warn{fill:#9a6700}
.h1{font-size:20px;font-weight:600}.h2{font-size:14px}.ct{font-size:14px;font-weight:600}.cb{font-size:13px}
.lead{stroke:#8250df;stroke-width:1.2;fill:none}.badge{fill:#8250df}.bn{fill:#ffffff;font-size:12px;font-weight:600}
.btn{fill:#ffffff;stroke:#d0d7de}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.pane{fill:#161b22;stroke:#30363d}.bar{fill:#21262d}.rest{fill:#30363d}
.p{fill:#e6edf3}.d{fill:#8b949e}.ok{fill:#3fb950}.warn{fill:#d29922}
.lead{stroke:#a371f7}.badge{fill:#a371f7}.btn{fill:#21262d;stroke:#30363d}
}
</style>
<rect class="bg" width="1200" height="790"/>
<text class="s p h1" x="40" y="36">usage-pane: what each part means</text>
<text class="s d h2" x="40" y="58">Example with made-up projects. The numbers match the notes on the right.</text>

<rect class="pane" x="40" y="74" width="540" height="660" rx="8"/>
<path class="bar" d="M48 74.5h524a7.5 7.5 0 0 1 7.5 7.5v22.5h-539v-22.5a7.5 7.5 0 0 1 7.5-7.5z"/>
<text class="s p b" x="56" y="94" font-size="13">Usage</text>
<text class="s d" x="558" y="94" font-size="14">×</text>

<text class="m p b" x="60" y="128">Plan limits</text>
<text class="m p" x="60" y="150">Week</text>
<text class="m p" x="172" y="150" text-anchor="end">68%</text>
<rect class="ok" x="182" y="139" width="88" height="12" rx="2"/><rect class="rest" x="270" y="139" width="40" height="12" rx="2"/>
<text class="m d" x="320" y="150">resets in 2d 20h</text>
<text class="m p" x="60" y="172">5 hours</text>
<text class="m p" x="172" y="172" text-anchor="end">31%</text>
<rect class="ok" x="182" y="161" width="40" height="12" rx="2"/><rect class="rest" x="222" y="161" width="88" height="12" rx="2"/>
<text class="m d" x="320" y="172">resets in 3h 12m</text>
<text class="m" x="60" y="194"><tspan class="p">Pace: </tspan><tspan class="warn">fast (59% of week gone, runs out in 1d 22h)</tspan></text>

<text class="m d" x="60" y="230">Since Oct 28 · 412M effective tokens · 37 sessions</text>

<text class="m p b" x="60" y="266">Who used it</text>
<rect class="mine" x="60" y="277" width="152" height="12" rx="2"/><rect class="ag" x="212" y="277" width="248" height="12" rx="2"/>
<rect class="mine" x="60" y="300" width="10" height="10" rx="2"/>
<text class="m p" x="76" y="310">you 38%</text>
<text class="m d" x="146" y="310">·</text>
<rect class="ag" x="160" y="300" width="10" height="10" rx="2"/>
<text class="m p" x="176" y="310">agents 62%</text>
<text class="m d" x="60" y="332">214 agents in 9 of 37 sessions</text>

<text class="m p b" x="60" y="368">Projects</text>
<text class="m p" x="96" y="390" text-anchor="end">34%</text>
<rect class="mine" x="106" y="379" width="16" height="12" rx="2"/><rect class="ag" x="122" y="379" width="112" height="12" rx="2"/>
<text class="m p" x="246" y="390">checkout-service</text>
<text class="m p" x="96" y="412" text-anchor="end">21%</text>
<rect class="mine" x="106" y="401" width="32" height="12" rx="2"/><rect class="ag" x="138" y="401" width="48" height="12" rx="2"/><rect class="rest" x="186" y="401" width="48" height="12" rx="2"/>
<text class="m p" x="246" y="412">marketing-site</text>
<text class="m p" x="96" y="434" text-anchor="end">15%</text>
<rect class="mine" x="106" y="423" width="48" height="12" rx="2"/><rect class="ag" x="154" y="423" width="8" height="12" rx="2"/><rect class="rest" x="162" y="423" width="72" height="12" rx="2"/>
<text class="m p" x="246" y="434">mobile-app</text>
<text class="m p" x="96" y="456" text-anchor="end">9%</text>
<rect class="mine" x="106" y="445" width="32" height="12" rx="2"/><rect class="rest" x="138" y="445" width="96" height="12" rx="2"/>
<text class="m p" x="246" y="456">data-pipeline</text>

<text class="m p b" x="60" y="492">Sessions</text>
<text class="m p" x="96" y="514" text-anchor="end">26%</text>
<rect class="mine" x="106" y="503" width="8" height="12" rx="2"/><rect class="ag" x="114" y="503" width="120" height="12" rx="2"/>
<text class="m p" x="246" y="514">Migrate payments to the new API</text>
<text class="m d" x="106" y="536">checkout-service · 88 agents, 91% of this session</text>
<text class="m p" x="96" y="558" text-anchor="end">14%</text>
<rect class="mine" x="106" y="547" width="32" height="12" rx="2"/><rect class="ag" x="138" y="547" width="40" height="12" rx="2"/><rect class="rest" x="178" y="547" width="56" height="12" rx="2"/>
<text class="m p" x="246" y="558">Redesign the pricing page</text>
<text class="m d" x="106" y="580">marketing-site · 40 agents, 62% of this session</text>
<text class="m p" x="96" y="602" text-anchor="end">7%</text>
<rect class="mine" x="106" y="591" width="32" height="12" rx="2"/><rect class="rest" x="138" y="591" width="96" height="12" rx="2"/>
<text class="m p" x="246" y="602">Fix login crash on Android</text>
<text class="m d" x="106" y="624">mobile-app · no agents</text>

<text class="m d" x="60" y="660">Models: opus-5-5 70% · sonnet-5-5 28% · haiku-5-5 2%</text>

<rect class="btn" x="60" y="684" width="76" height="26" rx="6"/>
<text class="s p" x="74" y="702" font-size="13">Refresh</text>
<text class="m d" x="148" y="702">updated 2 min ago</text>

<path class="lead" d="M590 138v40M586 138h4M586 178h4"/>
<path class="lead" d="M590 254v60M586 254h4M586 314h4"/>
<path class="lead" d="M590 356v106M586 356h4M586 462h4"/>
<path class="lead" d="M590 480v150M586 480h4M586 630h4"/>

<path class="lead" d="M614 158L656 112"/>
<path class="lead" d="M614 190L656 194"/>
<path class="lead" d="M614 226L656 276"/>
<path class="lead" d="M614 284L656 358"/>
<path class="lead" d="M614 328L656 440"/>
<path class="lead" d="M614 409L656 505"/>
<path class="lead" d="M614 555L656 587"/>
<path class="lead" d="M614 656L656 669"/>
<path class="lead" d="M614 697L656 717"/>

<g class="s">
<circle class="badge" cx="604" cy="158" r="10"/><text class="bn" x="604" y="162" text-anchor="middle">1</text>
<circle class="badge" cx="604" cy="190" r="10"/><text class="bn" x="604" y="194" text-anchor="middle">2</text>
<circle class="badge" cx="604" cy="226" r="10"/><text class="bn" x="604" y="230" text-anchor="middle">3</text>
<circle class="badge" cx="604" cy="284" r="10"/><text class="bn" x="604" y="288" text-anchor="middle">4</text>
<circle class="badge" cx="604" cy="328" r="10"/><text class="bn" x="604" y="332" text-anchor="middle">5</text>
<circle class="badge" cx="604" cy="409" r="10"/><text class="bn" x="604" y="413" text-anchor="middle">6</text>
<circle class="badge" cx="604" cy="555" r="10"/><text class="bn" x="604" y="559" text-anchor="middle">7</text>
<circle class="badge" cx="604" cy="656" r="10"/><text class="bn" x="604" y="660" text-anchor="middle">8</text>
<circle class="badge" cx="604" cy="697" r="10"/><text class="bn" x="604" y="701" text-anchor="middle">9</text>
</g>

<g class="s">
<text class="p ct" x="664" y="116">1  Plan limits</text>
<text class="d cb" x="664" y="135">Your plan's limits as Claude Code reports them: the weekly</text>
<text class="d cb" x="664" y="152">and the 5-hour window, with the time left to reset. Green</text>
<text class="d cb" x="664" y="169">under 75%, yellow from 75%, red from 90%.</text>

<text class="p ct" x="664" y="198">2  Pace</text>
<text class="d cb" x="664" y="217">Weekly usage against the share of the week already gone:</text>
<text class="d cb" x="664" y="234">on track, fast or too fast. If this pace would use up the</text>
<text class="d cb" x="664" y="251">limit before it resets, it says when. Hidden for the first 12 h.</text>

<text class="p ct" x="664" y="280">3  Period and total</text>
<text class="d cb" x="664" y="299">Counted since the weekly limit last reset. Effective tokens</text>
<text class="d cb" x="664" y="316">weigh each token by its cost (cache read 0.1×, output 5×),</text>
<text class="d cb" x="664" y="333">so the shares match what really uses up your limit.</text>

<text class="p ct" x="664" y="362">4  Who used it</text>
<text class="d cb" x="664" y="381">Your own conversations (blue) against the subagents and</text>
<text class="d cb" x="664" y="398">workflow agents they started (orange). Each agent re-reads</text>
<text class="d cb" x="664" y="415">the whole prompt and tool list, so agents often lead.</text>

<text class="p ct" x="664" y="444">5  Agent count</text>
<text class="d cb" x="664" y="463">How many agents ran this week, and in how many of your</text>
<text class="d cb" x="664" y="480">sessions.</text>

<text class="p ct" x="664" y="509">6  Projects</text>
<text class="d cb" x="664" y="528">The 8 folders that used the most. % is the share of the</text>
<text class="d cb" x="664" y="545">week's total. Bars are scaled to the biggest project and</text>
<text class="d cb" x="664" y="562">split into you and agents; grey is the empty rest.</text>

<text class="p ct" x="664" y="591">7  Sessions</text>
<text class="d cb" x="664" y="610">The 8 heaviest conversations by title. The line below gives</text>
<text class="d cb" x="664" y="627">the project, how many agents ran and their share of that</text>
<text class="d cb" x="664" y="644">session. "no agents": you did it all in the chat.</text>

<text class="p ct" x="664" y="673">8  Models</text>
<text class="d cb" x="664" y="692">Each model's share of the week's usage.</text>

<text class="p ct" x="664" y="721">9  Refresh</text>
<text class="d cb" x="664" y="740">Counts again now (or press r with the pane focused). It also</text>
<text class="d cb" x="664" y="757">refreshes every 5 minutes; open sessions share one count.</text>
</g>
</svg>
